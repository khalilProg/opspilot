spring:
  rabbitmq:
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false
    template:
      mandatory: true
  application:
    name: incident-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/incident_db}
    username: ${SPRING_DATASOURCE_USERNAME:incident_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
