name: Tag release images

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-images-${{ github.ref }}

jobs:
  release:
    name: Promote published image digests
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the successful main publication for this commit
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH'
            exit 1
          fi

          commit=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$commit" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run found for $commit. Rerun once that commit has published its images."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-manifest
          path: published
          github-token: ${{ github.token }}
          run-id: ${{ steps.publication.outputs.run-id }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the release tag and verify digests
        run: |
          jq -e --arg commit "$SOURCE_COMMIT" --arg ns "$IMAGE_NAMESPACE" '
            .commit == $commit and .tag == ("sha-" + $commit) and .security_policy == "trivy-v1" and
            ([.images[].component] | sort) == ["frontend", "incident", "monitor", "notification"] and
            all(.images[];
              .image == ($ns + "/opspilot-" + .component) and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              .reference == (.image + "@" + .digest))
          ' published/image-manifest.json > /dev/null

          rows=$(jq -r '.images[] | [.image, .digest, .reference] | @tsv' published/image-manifest.json)
          while IFS=$'\t' read -r image digest reference; do
            docker buildx imagetools inspect "$reference" > /dev/null
          done <<< "$rows"

          while IFS=$'\t' read -r image digest reference; do
            target="$image:$GITHUB_REF_NAME"
            docker buildx imagetools create --prefer-index=false --tag "$target" "$reference"
            actual=$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$target")
            if [[ "$actual" != "$digest" ]]; then
              echo "::error::The registry digest for $target differs from the published digest"
              exit 1
            fi
          done <<< "$rows"

          jq --arg tag "$GITHUB_REF_NAME" '.source_tag = .tag | .tag = $tag' \
            published/image-manifest.json > image-manifest.json
          {
            printf '### Release images for `%s`\n\n' "$GITHUB_REF_NAME"
            jq -r '.images[].reference | "- `\(.)`"' image-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-manifest
          path: image-manifest.json
          if-no-files-found: error
          overwrite: true
