name: Dependency and credential scans

on:
  workflow_call:
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'services/*/pom.xml'
      - name: Resolve Java dependency metadata for Trivy
        run: |
          mvn --batch-mode --no-transfer-progress -f services/monitor-service/pom.xml dependency:resolve
          mvn --batch-mode --no-transfer-progress -f services/incident-service/pom.xml dependency:resolve
      - name: Install Trivy
        run: |
          bash scripts/install-security-tools.sh "$RUNNER_TEMP/security-tools" trivy
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Scan dependency manifests and lockfiles
        run: |
          trivy fs --scanners vuln --pkg-types library --include-dev-deps --offline-scan --no-progress \
            --format json --output "$RUNNER_TEMP/dependencies.json" .
          bash scripts/check-vulnerabilities.sh "$RUNNER_TEMP/dependencies.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dependency-vulnerabilities
          path: ${{ runner.temp }}/dependencies.json

  credentials:
    name: Committed credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history with Gitleaks
        run: |
          bash scripts/install-security-tools.sh "$RUNNER_TEMP/security-tools" gitleaks
          "$RUNNER_TEMP/security-tools/gitleaks" git --no-banner --redact=100 --verbose
