# Docker DNS tracks service addresses when Compose recreates a container.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream monitor_api {
    zone monitor_api 64k;
    server monitor-service:8080 resolve;
}

upstream incident_api {
    zone incident_api 64k;
    server incident-service:8080 resolve;
}

log_format gateway '$remote_addr "$request" $status request_id=$request_id upstream_status=$upstream_status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    access_log /var/log/nginx/access.log gateway;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header_inherit merge;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
    proxy_redirect off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header Forwarded "";
    proxy_hide_header X-Request-ID;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location ~ ^/api/monitors(?:/|$) {
        error_page 502 = @api_bad_gateway;
        error_page 504 = @api_timeout;
        proxy_pass http://monitor_api;
    }

    location ~ ^/api/incidents(?:/|$) {
        error_page 502 = @api_bad_gateway;
        error_page 504 = @api_timeout;
        proxy_pass http://incident_api;
    }

    location ~ ^/api(?:/|$) {
        default_type application/json;
        return 404 '{"error":"API route not found"}';
    }

    location @api_bad_gateway {
        default_type application/json;
        return 502 '{"message":"The API service is unavailable."}';
    }

    location @api_timeout {
        default_type application/json;
        return 504 '{"message":"The API service did not respond in time."}';
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control no-cache always;
        try_files $uri =404;
    }

    location = / {
        rewrite ^ /index.html last;
    }

    location ~ ^/settings/?$ {
        rewrite ^ /index.html last;
    }

    location ~ ^/(?:monitors|incidents)(?:/|$) {
        try_files $uri /index.html;
    }

    location / { return 404; }
}
