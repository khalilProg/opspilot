# Docker DNS tracks service addresses when Compose recreates a container.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream monitor_api {
    zone monitor_api 64k;
    server monitor-service:8080 resolve;
}

upstream incident_api {
    zone incident_api 64k;
    server incident-service:8080 resolve;
}

log_format gateway '$remote_addr "$request" $status request_id=$request_id upstream_status=$upstream_status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log gateway;
    add_header X-Request-ID $request_id always;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_intercept_errors off;
    proxy_redirect off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Ssl "";
    proxy_set_header Forwarded "";
    proxy_hide_header X-Request-ID;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location ~ ^/api/monitors(?:/|$) {
        proxy_pass http://monitor_api;
    }

    location ~ ^/api/incidents(?:/|$) {
        proxy_pass http://incident_api;
    }

    location ~ ^/api(?:/|$) {
        default_type application/json;
        return 404 '{"error":"API route not found"}';
    }

    location ~ ^/(?:monitors|incidents)(?:/|$) {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
